<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#102533">
<meta name="robots" content="noindex, nofollow">
<title>SCOPE X</title>
<link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon.svg">
</head>
<body>
<nav class="tabbar" id="nav" hidden aria-label="Hauptnavigation">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 50 50)">
        <circle cx="50" cy="50" r="38" stroke="#126878" stroke-dasharray="68 170.76"/>
        <circle cx="50" cy="50" r="38" stroke="#19A6B5" stroke-dasharray="52 186.76"
                stroke-dashoffset="-96"/>
        <circle cx="50" cy="50" r="38" stroke="#B9D936" stroke-dasharray="26 212.76"
                stroke-dashoffset="-172"/>
      </g>
    </svg>
    <span class="type">SCOPE<span class="x">X</span></span>
  </div>

  <form class="nav-suche g-suche" role="search" data-suche>
    <label class="sr-only" for="nav-such">Suche</label>
    <svg class="lupe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/>
    </svg>
    <input id="nav-such" type="search" name="q" maxlength="80" autocomplete="off"
      placeholder="Suche">
  </form>

  <a href="#/" data-route="/">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.5 10.6 12 3.8l8.5 6.8v8.6a1.4 1.4 0 0 1-1.4 1.4h-4.4v-6h-5.4v6H4.9a1.4 1.4 0 0 1-1.4-1.4z"/>
    </svg><span class="lbl">Feed</span></a>

  <a href="#/entdecken" data-route="/entdecken" class="nur-breit">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/>
    </svg><span class="lbl">Entdecken</span></a>

      <circle cx="18.8" cy="15.6" r="2.4"/>
      <path d="M10.4 10 6.6 13.6M13.6 10l3.8 3.6M7.6 16.2h8.8"/>
    </svg><span class="lbl">Netzwerk</span><span class="badge" data-zaehler="anfragen" hidden></span></a>

  <a href="#/nachrichten" data-route="/nachrichten" class="nur-breit">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 3.5 10.2 13.3M21 3.5l-6.6 17-4.2-7.2L3 9.6z"/>
    </svg><span class="lbl">Nachrichten</span><span class="badge" data-zaehler="nachrichten" hidden></span></a>

  <a href="#/mitteilungen" data-route="/mitteilungen" class="nur-breit">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20.2s-7.8-4.6-7.8-10.2A4.4 4.4 0 0 1 12 7.3 4.4 4.4 0 0 1 19.8 10c0 5.6-7.8 10.2-7.8 10.2z"/>
    </svg><span class="lbl">Mitteilungen</span><span class="badge" data-zaehler="mitteilungen" hidden></span></a>

    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.6"/><path d="M12 8v8M8 12h8"/>
    </svg><span class="lbl">Neu</span>

  <a href="#/einsaetze" data-route="/einsaetze">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3.2a8.8 8.8 0 0 1 8.5 6.6M20.4 14a8.8 8.8 0 0 1-6.6 6.6M9.6 20.4A8.8 8.8 0 0 1 3.4 13"/>
      <circle cx="12" cy="12" r="2.4"/>
    </svg><span class="lbl">Logbuch</span></a>

  <a href="#/dashboard" data-route="/dashboard" class="nur-breit">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"

      <path d="M4.6 19.4h14.8"/><path d="M7.6 19.4v-6.2M12 19.4V6.6M16.4 19.4v-9"/>
    </svg><span class="lbl">Auswertung</span></a>

  <a href="#/profil" data-route="/profil" id="tab-profil">
    <span class="nav-av" id="nav-av" aria-hidden="true">

        <circle cx="12" cy="8.6" r="3.6"/><path d="M5.4 19.6a6.9 6.9 0 0 1 13.2 0"/>
      </svg></span><span class="lbl">Profil</span></a>

  <a href="#/administration" data-route="/administration" id="tab-admin" class="nur-breit" hidden>
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="8.2" r="3.2"/>
      <path d="M3.2 19.2a5.9 5.9 0 0 1 11.6 0"/>
      <circle cx="17.4" cy="9.4" r="2.5"/>
      <path d="M14.6 14.9a4.6 4.6 0 0 1 6.2 4.3"/>
    </svg><span class="lbl">Administration</span></a>
</nav>
<header class="g-top" id="g-top" hidden>
  <a href="#/" class="link-plain g-logo" aria-label="SCOPE X, zum Feed">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 50 50)">
        <circle cx="50" cy="50" r="38" stroke="#126878" stroke-dasharray="68 170.76"/>
        <circle cx="50" cy="50" r="38" stroke="#19A6B5" stroke-dasharray="52 186.76"
                stroke-dashoffset="-96"/>
        <circle cx="50" cy="50" r="38" stroke="#B9D936" stroke-dasharray="26 212.76"
                stroke-dashoffset="-172"/>
      </g>
    </svg></a>
  <form class="g-suche grow" role="search" data-suche>
    <label class="sr-only" for="top-such">Suche</label>
    <svg class="lupe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/>
    </svg>
    <input id="top-such" type="search" name="q" maxlength="80" autocomplete="off"
      placeholder="Suche">

  <a class="icon-btn flat link-plain" href="#/mitteilungen" aria-label="Mitteilungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2s-7.8-4.6-7.8-10.2A4.4 4.4 0 0 1 12 7.3 4.4 4.4 0 0 1 19.8 10c0 5.6-7.8 10.2-7.8 10.2z"/></svg>
    <span class="badge" data-zaehler="mitteilungen" hidden></span></a>
  <a class="icon-btn flat link-plain" href="#/nachrichten" aria-label="Nachrichten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3.5 10.2 13.3M21 3.5l-6.6 17-4.2-7.2L3 9.6z"/></svg>
    <span class="badge" data-zaehler="nachrichten" hidden></span></a>
</header>
