<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#102533">
<meta name="robots" content="noindex, nofollow">

<link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>

<body>
<nav class="tabbar" id="nav" hidden>
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">

        <circle cx="50" cy="50" r="38" stroke="#19A6B5" stroke-dasharray="68 170.76"/>
        <circle cx="50" cy="50" r="38" stroke="#19A6B5" stroke-dasharray="52 186.76"
                stroke-dashoffset="-96" opacity=".7"/>
        <circle cx="50" cy="50" r="38" stroke="#B9D936" stroke-dasharray="26 212.76"
                stroke-dashoffset="-172"/>
      </g>
    </svg>
    <span class="type">SCOPE<span class="x">X</span></span>
  </div>

  <a href="#/" data-route="/">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3.2a8.8 8.8 0 0 1 8.5 6.6M20.4 14a8.8 8.8 0 0 1-6.6 6.6M9.6 20.4A8.8 8.8 0 0 1 3.4 13"/>

  <a href="#/dashboard" data-route="/dashboard">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"

      <path d="M4.6 19.4h14.8"/><path d="M7.6 19.4v-6.2M12 19.4V6.6M16.4 19.4v-9"/>
    </svg>Auswertung</a>

  <button type="button" class="tab-new" id="tab-new" aria-label="Neue Dokumentation">
    <span class="disc" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M12 5.5v13M5.5 12h13"/>
      </svg>
    </span><span class="cap">Neu</span>
  </button>

  <a href="#/profil" data-route="/profil">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="8.6" r="3.6"/>
      <path d="M5.4 19.6a6.9 6.9 0 0 1 13.2 0"/>
    </svg>Profil</a>

  <a href="#/verwaltung" data-route="/verwaltung" id="tab-admin" hidden>
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="8.2" r="3.2"/>
      <path d="M3.2 19.2a5.9 5.9 0 0 1 11.6 0"/>
      <circle cx="17.4" cy="9.4" r="2.5"/>
      <path d="M14.6 14.9a4.6 4.6 0 0 1 6.2 4.3"/>
    </svg>Verwaltung</a>
